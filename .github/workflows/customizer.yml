# Builds the web customizer from the Swift package and publishes it on GitHub Pages.
# Requires Settings → Pages → Source: GitHub Actions.
name: Customizer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v4
    - uses: tomasf/Cadova/Actions/BuildCustomizer@1.3.0
      with:
        product: Connectors
    - id: deployment
      uses: actions/deploy-pages@v4
